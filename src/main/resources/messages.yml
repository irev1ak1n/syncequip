# SyncEquip messages (MiniMessage format: https://docs.advntr.dev/minimessage/format)
# Set a message to '' to disable it.

prefix: '<dark_gray>[<gray>Sync<white>Equip</white></gray>]</dark_gray> '

command:
  unknown: '<red>Unknown subcommand <white><input></white>. Try <white>/syncequip help</white>.'
  players-only: '<red>Only players can use this command.'
  no-permission: '<red>You do not have permission to do that.'
  squad-usage: '<red>Usage: /syncequip squad \<create|invite|join|leave|list|info|start|cancel|unequip|transfer|speed|pad|loadout|disband>'
  missing-player: '<red>Usage: /syncequip squad <sub> \<player or squad>'
  player-not-found: '<red>Player <white><player></white> is not online.'
  failed: '<red>That did not work.'

solo:
  cannot-start: '<red>Cannot start: <reason>.'

problem:
  busy: 'already in a sequence'
  cooldown: 'on cooldown for <seconds>s'
  invalid: 'cannot change equipment right now'
  offline: 'offline'
  nothing: 'nothing to equip'
  missing: 'missing <pieces>'
  occupied: 'already wearing <pieces>'
  occupied-hand: 'hands already busy with <pieces>'
  nothing-to-remove: 'nothing to take off'
  no-room: 'not enough free inventory slots'

reason:
  disconnected: 'disconnected'
  died: 'you died'
  changed_world: 'you changed worlds'
  left_squad: 'you left the squad'
  item_unavailable: 'an item was no longer available'
  no_inventory_space: 'there was no room in your inventory'
  invalid_state: 'you could not change equipment'

sequence:
  countdown-title: '<white><bold><seconds>'
  countdown-subtitle: '<gray>Hold formation'
  countdown-actionbar: '<gray>Equipping in <white><bold><seconds></bold></white>...'
  progress-actionbar: '<gray><bar> <white><piece>'
  completed-actionbar: '<green>Equipped <count>/<total>'
  completed-partial: '<yellow>Sequence finished: <count> of <total> pieces equipped (unavailable steps were skipped).'
  removed-before-start: '<yellow>You were removed from the sequence before anything was equipped (<reason>). Your inventory is unchanged.'
  interrupted: '<yellow>Sequence interrupted (<reason>): <count> of <total> pieces were equipped and stay on you; the rest are still in your inventory.'
  member-dropped: '<yellow><player> dropped out of the sequence (<reason>).'
  cancelled-before-start: '<yellow>Sequence cancelled before anything was equipped. Your inventory is unchanged.'
  cancelled-midway: '<yellow>Sequence cancelled: <count> of <total> pieces were equipped and stay on you; the rest are still in your inventory.'
  shutdown-before-start: '<yellow>SyncEquip is shutting down; the sequence was cancelled before anything was equipped.'
  shutdown-midway: '<yellow>SyncEquip is shutting down; <count> of <total> pieces were equipped, the rest are still in your inventory.'

squad:
  created: '<green>Squad created. Its name is <white><squad></white>. Invite players with <white>/syncequip squad invite \<player></white> or set a joining block with <white>/syncequip squad pad set</white>.'
  already-in-squad: '<red>You are already in a squad. Leave it first with <white>/syncequip squad leave</white>.'
  not-in-squad: '<red>You are not in a squad.'
  leader-only: '<red>Only the squad leader can do that.'
  not-yourself: '<red>You cannot target yourself.'
  already-member: '<red><player> is already in your squad.'
  full: '<red>The squad is full (max <max> players).'
  invite-sent: '<green>Invited <white><player></white>. The invite expires in <seconds>s.'
  invite-received: '<green><white><leader></white> invited you to their squad. Join with <white><click:run_command:/syncequip squad join <leader>>/syncequip squad join <leader></click></white> within <seconds>s.'
  invite-leave-first: '<gray>You are already in a squad; leave it before joining.'
  no-such-squad: '<red><player> is not leading a squad.'
  not-invited: '<red>You have no valid invite from <player>.'
  member-joined: '<green><white><player></white> joined the squad.'
  member-left: '<yellow><player> left the squad.'
  leader-changed: '<gold><player> is now the squad leader.'
  left: '<yellow>You left the squad.'
  target-not-member: '<red><player> is not in your squad.'
  list-header: '<gold>Squad members (<count>/<max>):'
  list-leader: ' <gold>★</gold> <white><player></white> <gray>(leader)'
  list-member: ' <gray>•</gray> <white><player>'
  already-running: '<red>Your squad already has a sequence running.'
  nothing-to-cancel: '<red>Your squad has no sequence running.'
  start-blocked: '<red>Cannot start: <count> member(s) are not ready:'
  start-blocked-line: ' <gray>•</gray> <white><player></white><gray>: <reason>'
  restored: '<gray>Saved settings for <squad> were restored (speed, loadout, joining block).'
  name-invalid: '<red>Squad names use letters, digits, - and _, 2 to 24 characters.'
  name-taken: '<red>A squad called <squad> is already running.'
  name-reserved: '<red>The name <squad> belongs to another player''s saved squad.'
  loadout-empty: '<red>The squad loadout has no slots turned on. Check <white>/syncequip squad loadout show</white>.'
  more-blocked: ' <gray>...and <count> more'
  admin-only: '<red>Only an administrator can manage another squad.'
  no-squad-named: '<red>There is no squad called <name>.'
  busy-no-change: '<red>A sequence is running. Wait for it to finish or cancel it, then change this.'
  disbanded: '<yellow>Squad <squad> was disbanded.'
  started: '<green><white><leader></white> started the squad sequence (<count> players, <ticks> ticks apart). Hold still!'

settings:
  header: '<gold>SyncEquip settings:'
  line: ' <gray><name>:</gray> <white><value>'

reload:
  success: '<green>Configuration reloaded.'
  warnings: '<yellow>Configuration reloaded with <count> warning(s):'
  warning-line: ' <gray>• <warning>'

help:
  header: '<gold>SyncEquip commands:'
  lines:
    - ' <white>/syncequip solo</white> <gray>- equip your armor and shield in sequence'
    - ' <white>/syncequip unequip</white> <gray>- take them off again in reverse order'
    - ' <white>/syncequip squad create [name]</white> <gray>- create a squad'
    - ' <white>/syncequip squad invite \<player></white> <gray>- invite a player'
    - ' <white>/syncequip squad join \<squad or leader></white> <gray>- join a squad you were invited to'
    - ' <white>/syncequip squad leave</white> <gray>- leave your squad'
    - ' <white>/syncequip squad list</white> <gray>- list squad members'
    - ' <white>/syncequip squad info</white> <gray>- show speed, loadout and joining block'
    - ' <white>/syncequip squad start</white> <gray>- start the synchronized sequence (leader)'
    - ' <white>/syncequip squad unequip</white> <gray>- everyone takes their gear off together (leader)'
    - ' <white>/syncequip squad cancel</white> <gray>- cancel the running sequence (leader)'
    - ' <white>/syncequip squad speed [ticks|default]</white> <gray>- ticks between pieces, 1 to 10 (leader)'
    - ' <white>/syncequip squad pad set|remove|info|enable|disable</white> <gray>- joining block (leader)'
    - ' <white>/syncequip squad loadout show|reset|set|optional|order</white> <gray>- required items (leader)'
    - ' <white>/syncequip squad transfer \<player></white> <gray>- make another member the leader'
    - ' <white>/syncequip squad disband</white> <gray>- end the squad and forget its settings (leader)'
    - ' <white>/syncequip settings</white> <gray>- show the active settings'
    - ' <white>/syncequip reload</white> <gray>- reload the configuration (admin)'

demo:
  usage: '<red>Usage: /syncequip demo \<spawn \<count>|start|repeat \<times>|stop|reset|clear|speed \<ticks>>'
  count-invalid: '<red>Choose a number of mobs from 1 to <max>.'
  repeat-invalid: '<red>Usage: /syncequip demo repeat \<times> (1 to <max>)'
  speed-invalid: '<red>Choose a whole number of ticks from 1 to 10. The current interval is <current> ticks.'
  speed-set: '<green>Demo interval set to <ticks> ticks (about <ms> ms) between pieces. It applies to the next run.'
  spawned: '<green>Spawned <count> demo husks. Start the sequence with <white>/syncequip demo start</white>.'
  no-mobs: '<red>There are no demo mobs. Spawn some with <white>/syncequip demo spawn \<count></white>.'
  busy: '<red>A demo run is already going. Use <white>/syncequip demo stop</white> first.'
  started: '<green>Demo started with <count> mobs and <ticks> ticks between pieces.'
  repeat-started: '<green>Demo started with <count> mobs, <ticks> ticks between pieces, <runs> runs.'
  run-finished: '<green>Demo run <run> of <total> done'
  finished: '<green>Demo finished. Use <white>/syncequip demo start</white> to replay or <white>/syncequip demo reset</white> to undress the mobs.'
  stopping: '<yellow>Demo stopped.'
  stopped: '<yellow>Demo stopped. Pieces already equipped stay on the mobs until you run reset.'
  nothing-running: '<yellow>No demo run is going.'
  reset: '<green>Removed the equipment from <count> demo mobs.'
  cleared: '<green>Removed <count> demo mobs.'
  peaceful: '<red>Husks are removed instantly on Peaceful difficulty. Raise the difficulty (for example <white>/difficulty easy</white>) and try again.'
  spawn-short: '<yellow>Only <count> of <wanted> husks could be spawned. Another plugin may have blocked the rest.'


unequip:
  cannot-start: '<red>Cannot take your gear off: <reason>.'
  left-out: '<yellow>You were left out of the unequip: <reason>. Free some inventory slots first.'
  excluded: '<yellow><count> member(s) were left out because they cannot take part:'
  nobody: '<red>Nobody in the squad has anything to take off.'
  skipped-empty: '<gray><count> member(s) had nothing to take off.'
  started: '<green><white><leader></white> started the squad unequip (<count> players, <ticks> ticks apart).'
  removed-before-start: '<yellow>You were removed before anything came off (<reason>). Your inventory is unchanged.'
  interrupted: '<yellow>Unequip interrupted (<reason>): <count> of <total> pieces were put back in your inventory, the rest are still equipped.'
  completed-actionbar: '<green>Unequipped <count>/<total>'
  completed-partial: '<yellow>Unequip finished: <count> of <total> pieces went back to your inventory (the rest were not equipped).'
  cancelled-before-start: '<yellow>Unequip cancelled before anything came off.'
  cancelled-midway: '<yellow>Unequip cancelled: <count> of <total> pieces went back to your inventory, the rest are still equipped.'
  shutdown-before-start: '<yellow>SyncEquip is shutting down; nothing was taken off.'
  shutdown-midway: '<yellow>SyncEquip is shutting down; <count> of <total> pieces went back to your inventory, the rest are still equipped.'

info:
  header: '<gold>Squad <white><squad></white>:'
  members: ' <gray>Members:</gray> <white><count>/<max></white> <gray>(leader <leader>)'
  inactive: ' <gray>Not running right now. Its leader can bring it back with /syncequip squad create.'
  speed: ' <gray>Speed:</gray> <white><ticks> ticks</white> <gray>(about <ms> ms, <source>)'
  loadout: ' <gray>Loadout:</gray> <white><steps></white> <gray>(<source>)'
  pad: ' <gray>Joining block:</gray> <white><pad>'

speed:
  current: '<gray>Squad speed is <white><ticks> ticks</white> between pieces (about <ms> ms, <source>).'
  set: '<green>Squad speed set to <white><ticks> ticks</white> (about <ms> ms). It applies to equipping and unequipping.'
  reset: '<green>Squad speed is back to the default of <white><ticks> ticks</white> (about <ms> ms).'
  invalid: '<red>Choose a whole number of ticks from 1 to 10, or <white>default</white>.'

pad:
  usage: '<red>Usage: /syncequip squad pad \<set|remove|info|enable|disable> [squad]'
  set: '<green>Joining block for <white><squad></white> set at <white><where></white>. Players who step on it join the squad.'
  not-solid: '<red>Stand on a solid block first.'
  conflict: '<red>Another squad already uses that block as its joining block.'
  removed: '<green>Removed the joining block of <white><squad></white>.'
  none: '<yellow><squad> has no joining block.'
  enabled: '<green>Joining block of <white><squad></white> is on.'
  disabled: '<yellow>Joining block of <white><squad></white> is off. Nobody joins by stepping on it.'
  info: '<gray>Joining block of <white><squad></white>: <white><where>'
  joined: '<green>You joined squad <white><squad></white>'
  inactive: '<yellow>Squad <squad> is not running right now. Ask its leader to start it.'
  in-other-squad: '<yellow>You are in squad <current>. Use <white>/syncequip squad leave</white> to join <squad>.'
  full: '<red>Squad <squad> is full (max <max> players).'
  leader-count: '<gray><squad>: <white><count></white> members'
  destroyed: '<yellow>The joining block of <squad> at <x> <y> <z> was destroyed, so it was removed. Set a new one with /syncequip squad pad set.'

loadout:
  usage: '<red>Usage: /syncequip squad loadout \<show|reset|set|optional|order>'
  usage-set: '<red>Usage: /syncequip squad loadout set \<mainhand|offhand|helmet|chestplate|leggings|boots> \<item|any|any_sword|none> [optional]'
  usage-optional: '<red>Usage: /syncequip squad loadout optional \<slot> \<on|off>'
  usage-order: '<red>Usage: /syncequip squad loadout order \<slot> \<slot> ... (any slots you leave out go last)'
  unknown-slot: '<red><slot> is not a slot. Use mainhand, offhand, helmet, chestplate, leggings or boots.'
  invalid: '<red><reason>'
  set: '<green><slot> now needs: <white><value></white>'
  reset: '<green>Squad loadout is back to the default.'
  optional-on: '<green><slot> is optional. It is skipped quietly when missing.'
  optional-off: '<green><slot> is required again.'
  order-set: '<green>Sequence order: <white><steps></white>'
  header: '<gold>Loadout of <white><squad></white> <gray>(<source>)<gold>:'
  line: ' <gray><slot>:</gray> <white><value></white><gray><flags>'
  order: ' <gray>Order:</gray> <white><steps>'
