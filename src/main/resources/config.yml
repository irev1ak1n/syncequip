# ---------------------------------------------------------------------------
#  SyncEquip configuration
#  Reload with /syncequip reload. Sequences already running keep the settings
#  they started with; new sequences use the reloaded values.
# ---------------------------------------------------------------------------

equipment:
  # Server ticks between two equipment steps (1-10). 20 ticks = 1 second at full TPS.
  # The default of 2 puts the five steps at offsets 0, 2, 4, 6 and 8 ticks (~0.4 s).
  interval-ticks: 2

  # Order of the steps: BOOTS, LEGGINGS, CHESTPLATE, HELMET, SHIELD (the offhand) and MAIN_HAND.
  # Solo sequences use exactly the steps listed here. Squads use the order, then add any other slot their
  # loadout needs at the end. Unknown or duplicate entries are ignored with a warning.
  order:
    - BOOTS
    - LEGGINGS
    - CHESTPLATE
    - HELMET
    - SHIELD

  # Worn armor, the offhand and the held item are swapped automatically. A sword on the
  # hotbar is selected, and displaced items go back to the inventory. Nothing is dropped.

  # What to do when a step's item is missing or its slot is occupied:
  #   ABORT - refuse to start; if it happens mid-sequence, stop that player's sequence
  #           (pieces already equipped stay equipped).
  #   SKIP  - skip that step and continue; a player needs at least one usable piece.
  missing-item-policy: ABORT

  # Block inventory clicks, drops and hand swaps during the ~0.4 s in which a
  # player's equipment is actively changing.
  lock-inventory-during-sequence: true

solo:
  # Countdown before a personal sequence (0 = start on the next tick).
  countdown-seconds: 0

synchronization:
  # Countdown before a squad sequence (0-10). Every member sees the same beats.
  countdown-seconds: 3
  # Maximum squad size, leader included. There is no hard-coded upper limit.
  max-squad-size: 30
  # How long a squad invite stays valid.
  invite-expiry-seconds: 60
  # Countdown before a squad unequip (0-10 seconds).
  unequip-countdown-seconds: 3

sounds:
  # true:  SyncEquip equips silently and plays exactly one sound per step itself.
  # false: no custom sounds; vanilla's own armor equip sounds play instead
  #        (vanilla plays nothing for a shield moved into the offhand).
  enabled: true
  # Use the vanilla equip sound matching each armor material (leather, chain, iron,
  # gold, diamond, netherite, turtle, copper). If false, armor-fallback-sound is used.
  use-vanilla-armor-sounds: true
  armor-fallback-sound: minecraft:item.armor.equip_generic
  volume: 1.0
  pitch: 1.0
  shield:
    sound: minecraft:item.shield.block
    volume: 0.8
    pitch: 1.2
  # Short cue on each countdown beat, heard only by the participant.
  countdown:
    enabled: true
    sound: minecraft:block.note_block.hat
  # Cue when the countdown ends (same tick as the first step).
  go:
    enabled: false
    sound: minecraft:block.note_block.snare
  # Cue after the last step.
  completion:
    enabled: false
    sound: minecraft:item.armor.equip_netherite
  # Sound for the main hand step (a sword being drawn).
  mainhand:
    sound: minecraft:item.armor.equip_chain
    volume: 0.8
    pitch: 1.4
  # Taking things off plays the same sounds at this multiple of the pitch (lower sounds like removing).
  unequip-pitch-multiplier: 0.8

visuals:
  # A few small crit particles at the height of each piece as it is equipped.
  particles-enabled: false
  # Progress bar in the action bar while equipping.
  actionbar-enabled: true
  # How the countdown is shown: TITLE, ACTIONBAR or NONE.
  countdown-display: TITLE

controls:
  # Start a sequence by sneaking and pressing the swap-hands key (Shift + F by default).
  # While enabled, sneak + F no longer swaps hands; plain F still does.
  sneak-swap-trigger: false
  # SOLO: always a personal sequence. AUTO: start your squad if you lead one.
  sneak-swap-action: SOLO
  # Seconds between sequences per player (applies to every participant when a sequence starts).
  cooldown-seconds: 3

# What squad members must have, by default. Each squad can override this with /syncequip squad loadout.
# Values: none (slot not used), any, any_sword and any_axe (main hand only), an item name such as
# netherite_sword or totem_of_undying, or for armor a material alone such as netherite.
loadout:
  default:
    mainhand: any_sword
    offhand: shield
    helmet: any
    chestplate: any
    leggings: any
    boots: any
    # Slots listed here are skipped quietly when the player lacks them (for example: [mainhand]).
    optional: []
  # false: solo sequences keep the original armor and shield behaviour.
  # true: solo sequences use the loadout above too (sword included).
  solo-uses-default: false

blocks:
  # Joining blocks: a leader runs /syncequip squad block set obsidian (or stands on a block and runs
  # /syncequip squad block set). Anyone who steps onto a block of that material joins the squad.
  enabled: true
  # A player who steps onto a block they cannot use (full squad, already in another squad) hears about it at most
  # this often.
  notice-cooldown-seconds: 5
  # false: the material only works in the world where the leader set it.
  # true: it works in every world.
  all-worlds: false

debug:
  # Log the scheduled and actual server tick of every step for every player.
  log-sequence-ticks: false

demo:
  # Demo mode spawns a row of husks and equips them on the shared tick scheduler, so you can watch
  # the sequence without other players. Commands need the syncequip.demo permission (op by default).
  # Ticks between steps. 4 makes each piece easy to see. Change at runtime with /syncequip demo speed.
  interval-ticks: 4
  # Countdown before a demo run starts (0-10 seconds).
  countdown-seconds: 3
  # In repeat mode, how long the finished result stays on screen before the next run (0-60 seconds).
  repeat-hold-seconds: 3
  # Most mobs one spawn command may create (1-100).
  max-mobs: 20
  # Blocks between mobs in the row, and how far in front of you the row is placed.
  spacing: 1.5
  distance: 4.0
  # TOWARD_PLAYER: the mobs turn to face you. SAME_AS_PLAYER: they face the way you face.
  facing: TOWARD_PLAYER
  tour:
    # The guided tour (/syncequip demo tour) uses online players whose names start with this.
    bot-prefix: TourBot
